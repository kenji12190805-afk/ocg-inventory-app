# コード辞典(code-cheatsheet)を GitHub Pages に公開する
# 使うには: リポジトリの Settings → Pages → Source を "GitHub Actions" にする
name: Deploy code-cheatsheet to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['code-cheatsheet/**', '.github/workflows/code-cheatsheet-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-cheatsheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code-cheatsheet/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code-cheatsheet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
