name: Build card dataset

on:
  schedule:
    - cron: "0 18 * * 0" # every Sunday 18:00 UTC (~Monday 03:00 JST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch BabelCDB
        run: npm run fetch:babelcdb

      - name: Fetch & merge JA texts
        run: npm run fetch:ja-texts

      - name: Fetch Yugipedia set/rarity data
        run: npm run fetch:yugipedia

      - name: Fetch Yugipedia fallback cards (for cards BabelCDB doesn't have yet)
        run: npm run fetch:yugipedia-cards

      # Card artwork essentially never changes for an existing id, so caching
      # work/card_hashes.json across runs means each week only re-fetches images for
      # cards that were added since the last run, instead of hitting the (third-party,
      # rate-limit-sensitive) image CDN for all ~15k cards every single week.
      - name: Restore card art hash cache
        uses: actions/cache@v4
        with:
          path: data-pipeline/work/card_hashes.json
          key: card-hashes-${{ github.run_id }}
          restore-keys: card-hashes-

      - name: Fetch & hash card artwork (for camera イラストで識別 matching)
        run: npm run fetch:card-hashes

      - name: Build dataset
        run: npm run build

      - name: Generate changelog (diff against the currently-live dataset)
        run: npm run changelog

      - name: Publish dataset as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dataset-latest
          name: "Card dataset (latest)"
          body: "Auto-built by build-dataset.yml on ${{ github.event.repository.updated_at }}. Superseded on every run -- the app should always pull the `dataset-latest` release."
          files: |
            data-pipeline/dist/dataset.db
            data-pipeline/dist/meta.json
            data-pipeline/dist/changelog.json
